<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>PixelDeck — Free App Store &amp; Play Store Screenshot Generator</title>
    <meta name="description" content="Design App Store and Google Play screenshots in your browser: templates, device mockups, every store size and language. Free, open source, no account." />
    <meta name="theme-color" content="#0f0f13" />

    <!-- Open Graph. Link previews need an absolute URL to a raster image (SVG is ignored). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PixelDeck" />
    <meta property="og:url" content="https://pr0xs.github.io/PixelDeck/" />
    <meta property="og:title" content="PixelDeck — Free App Store &amp; Play Store Screenshot Generator" />
    <meta property="og:description" content="Pick a template, drop in your screenshots, export every size and language. Free, open source, runs in your browser." />
    <meta property="og:image" content="https://pr0xs.github.io/PixelDeck/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="App Store screenshots made with PixelDeck" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PixelDeck — Free App Store &amp; Play Store Screenshot Generator" />
    <meta name="twitter:description" content="Pick a template, drop in your screenshots, export every size and language. Free, open source, runs in your browser." />
    <meta name="twitter:image" content="https://pr0xs.github.io/PixelDeck/og.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

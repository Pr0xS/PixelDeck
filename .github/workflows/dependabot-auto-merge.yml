name: Dependabot auto-merge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    name: Auto-merge eligible dependency updates
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Policy (evaluated on EVERY dependency in the PR, so grouped PRs are safe):
      #   - any dependency (prod, dev, indirect): semver-patch
      #   - development dependencies only: semver-minor too
      # Anything else (prod minor, majors) stays manual. Auto-merge still waits
      # for all required status checks (Quality, CLI smoke test, PR title).
      - name: Decide auto-merge eligibility
        id: policy
        env:
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          eligible=$(echo "$DEPS_JSON" | jq -r '
            length > 0 and all(.[];
              .updateType == "version-update:semver-patch"
              or (.dependencyType == "direct:development"
                  and .updateType == "version-update:semver-minor"))')
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge
        if: steps.policy.outputs.eligible == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    <i class="ic s32" style="color:#8a7ba8">close</i>
    <div class="progress grow" style="height:16px"><i style="--v:45%;--c:#7c3aed"></i></div>

  </div>
  <div class="row between"><span class="badge" style="height:28px;font-size:13px">🍽️ Food &amp; Drink</span><span class="sm muted strong">Review mode</span></div>

  <div class="card" style="padding:0;border-radius:30px;border-width:3px;box-shadow:0 8px 0 var(--line);margin-top:4px;overflow:hidden">
    <div style="background:linear-gradient(160deg,#ffe9a8,#ffd25e);height:230px;display:flex;align-items:center;justify-content:center;font-size:120px" class="emo">🍎</div>

      <div class="muted semi" style="margin-top:4px;font-size:16px">/la manˈθa.na/</div>
      <div class="row g8 center" style="margin-top:14px"><span style="width:44px;height:44px;border-radius:14px;background:#f1e8ff;display:inline-flex;align-items:center;justify-content:center;color:var(--primary)"><i class="ic fill">volume_up</i></span><span class="sm muted strong">Tap card to flip</span></div>
    </div>
  </div>

  <div class="sm muted strong" style="text-align:center;margin-top:2px">How well did you remember?</div>
  <div class="grid2" style="grid-template-columns:repeat(4,1fr);gap:8px">
    <div style="background:#ffe1dd;color:#d94b3f;border-radius:16px;height:54px;box-shadow:0 4px 0 #f5b5ae;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px">Again</div>

    <div style="background:#e5d6fd;color:#6228c9;border-radius:16px;height:54px;box-shadow:0 4px 0 #c4a8f3;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px">Easy</div>
  </div>

  <div class="tabbar">
    <div><i class="ic fill">home</i>Learn</div>

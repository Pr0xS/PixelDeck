<div class="screen" style="gap:14px">
  <div class="topbar">
    <span class="pill" style="padding:0 12px 0 10px"><span class="emo" style="font-size:20px">🇪🇸</span></span>
    <span class="pill" style="color:#ff6b5e;font-weight:900"><span class="emo" style="font-size:18px">🔥</span>30</span>
    <span class="pill" style="color:#7c3aed;font-weight:900"><span class="emo" style="font-size:18px">💎</span>480</span>
    <span class="pill" style="color:#ff6b5e;font-weight:900"><span class="emo" style="font-size:18px">❤️</span>5</span>

  <div class="card hero" style="padding:16px 18px">
    <div class="row between">
      <div>
        <div class="caps" style="opacity:.8">Section 2 · Unit 3</div>
        <div class="h1" style="font-size:25px;margin-top:2px">Order food &amp; drinks</div>

    </div>
  </div>

  <div class="card row g12" style="padding:12px 14px">
    <div class="tile sm" style="background:#fff0c2"><span class="emo" style="font-size:20px">🎯</span></div>
    <div class="grow">
      <div class="row between"><span class="sm strong">Daily goal</span><span class="sm strong" style="color:var(--primary)">40 / 50 XP</span></div>
      <div class="progress" style="margin-top:6px;height:12px"><i style="--v:80%;--c:#ffc93c"></i></div>
    </div>
  </div>

  <div style="position:relative;height:470px;margin:6px -20px 0">
    <div style="position:absolute;left:22px;top:64px;font-size:46px" class="emo">🍕</div>
    <div style="position:absolute;left:44px;top:300px;font-size:40px;transform:rotate(-10deg)" class="emo">🥑</div>
    <div style="position:absolute;right:26px;top:210px;font-size:44px;transform:rotate(12deg)" class="emo">🥤</div>

    <div class="node done" style="position:absolute;left:187px;top:0"><i class="ic fill s32">check</i></div>
    <div class="node done" style="position:absolute;left:247px;top:84px"><i class="ic fill s32">check</i></div>
    <div class="node done" style="position:absolute;left:277px;top:168px"><i class="ic fill s32">check</i></div>

    <div style="position:absolute;left:112px;top:248px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:6px 14px;font-weight:900;color:var(--primary);letter-spacing:.06em;font-size:14px">START<span style="position:absolute;right:-7px;top:50%;margin-top:-6px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)"></span></div>
    <div class="node big" style="position:absolute;left:210px;top:244px"><i class="ic fill s32" style="font-size:38px">star</i></div>

    <div class="node todo" style="position:absolute;left:160px;top:350px"><i class="ic fill s28">lock</i></div>
    <div class="node todo gold" style="position:absolute;left:112px;top:430px;opacity:.0"></div>
  </div>

  <div class="tabbar">
    <div class="on"><i class="ic fill">home</i>Learn</div>
    <div><i class="ic fill">bolt</i>Practice</div>
    <div><i class="ic fill">emoji_events</i>Leagues</div>
    <div><i class="ic fill">redeem</i>Quests</div>
    <div><i class="ic fill">person</i>Profile</div>
  </div>
  <div class="home-ind"></div>
</div>

<div class="screen" style="gap:14px;background:#fff7e8">
  <div class="row g12" style="min-height:44px">
    <i class="ic s32" style="color:#8a7ba8">close</i>
    <div class="progress grow" style="height:16px"><i style="--v:68%;--c:#22b573"></i></div>
    <span class="pill" style="color:#ff6b5e;font-weight:900;padding:0 10px;height:32px"><span class="emo" style="font-size:16px">❤️</span>5</span>
  </div>

  <div class="h1" style="font-size:25px;margin-top:6px">Translate this sentence</div>

  <div class="row g12" style="align-items:center">
    <div style="width:84px;height:84px;border-radius:26px;background:#ffe9a8;display:flex;align-items:center;justify-content:center;font-size:50px;border:2px solid #f2d27a;box-shadow:0 4px 0 #f2d27a" class="emo">📚</div>
    <div class="grow" style="position:relative;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px;padding:14px 16px">
      <div class="row g10"><span style="width:38px;height:38px;border-radius:12px;background:#f1e8ff;display:inline-flex;align-items:center;justify-content:center;color:var(--primary)"><i class="ic fill s20">volume_up</i></span><span style="font-size:19px;font-weight:900;border-bottom:2px dashed #c9b8ee;line-height:1.2">Where is the library?</span></div>
      <span style="position:absolute;left:-8px;top:50%;margin-top:-7px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)"></span>
    </div>
  </div>

  <div class="row g8" style="background:#fff0c2;border-radius:16px;padding:10px 14px;color:#8a5a00;font-weight:900;font-size:14px"><span class="emo" style="font-size:20px">🔥</span>3 in a row! Keep it up <span class="grow"></span><span style="background:#ffc93c;color:#2a1259;border-radius:999px;padding:3px 10px;font-size:12px">+5 XP</span></div>

  <div class="col" style="gap:12px;margin-top:2px">
    <div class="ans" style="height:66px"><span class="k">1</span>¿Dónde está la playa?</div>
    <div class="ans on" style="height:66px"><span class="k">2</span>¿Dónde está la biblioteca?</div>
    <div class="ans" style="height:66px"><span class="k">3</span>¿Cuándo abre la biblioteca?</div>
    <div class="ans" style="height:66px"><span class="k">4</span>¿Quién es la bibliotecaria?</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:652px;height:250px;background:#fff;border-top:2px solid var(--line);padding:18px 20px 0">
    <div class="btn block" style="height:60px;font-size:18px">Check</div>
    <div class="center sm" style="margin-top:14px;color:var(--muted);font-weight:900;letter-spacing:.08em">SKIP</div>
  </div>
  <div class="home-ind"></div>
</div>

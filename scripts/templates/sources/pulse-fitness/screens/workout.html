<div class="screen" style="gap:18px">
  <div class="topbar">
    <div class="icon-btn"><i class="ic s20">keyboard_arrow_down</i></div>
    <div class="col g4 center" style="align-items:center">
      <div class="xs muted semi">EXERCISE 4 OF 8</div>
      <div class="h3">Upper Body Power</div>
    </div>
    <div class="icon-btn"><i class="ic s20">music_note</i></div>
  </div>

  <div class="row g6">
    <div class="progress grow" style="--v:100%"><i></i></div>
    <div class="progress grow" style="--v:100%"><i></i></div>
    <div class="progress grow" style="--v:100%"><i></i></div>
    <div class="progress grow" style="--v:55%"><i></i></div>
    <div class="progress grow" style="--v:0%"><i></i></div>
    <div class="progress grow" style="--v:0%"><i></i></div>
    <div class="progress grow" style="--v:0%"><i></i></div>
    <div class="progress grow" style="--v:0%"><i></i></div>
  </div>

  <div class="col center" style="align-items:center;gap:2px;margin-top:6px">
    <div class="ring lime-glow" style="--v:62;--size:262px;--thick:16px;--ring-bg:#0b0d0c">
      <div class="caps muted">Time</div>
      <div class="kpi num" style="font-size:86px;line-height:.9">18:42</div>
      <div class="sm semi primary">Set 2 of 3</div>
    </div>
  </div>

  <div class="grid3">
    <div class="card center" style="padding:12px 8px">
      <div class="h2 num accent">142</div>
      <div class="xs muted semi">BPM</div>
    </div>
    <div class="card center" style="padding:12px 8px">
      <div class="h2 num">214</div>
      <div class="xs muted semi">KCAL</div>
    </div>
    <div class="card center" style="padding:12px 8px">
      <div class="h2 num">1,860</div>
      <div class="xs muted semi">KG LIFTED</div>
    </div>
  </div>

  <div class="card" style="padding:16px">
    <div class="row g12">
      <div class="tile lg solid"><i class="ic s28">fitness_center</i></div>
      <div class="grow">
        <div class="h2">Bench Press</div>
        <div class="sm muted">3 sets × 10 reps · 60 kg</div>
      </div>
      <span class="badge good">PR pace</span>
    </div>
    <div class="row g8" style="margin-top:14px">
      <div class="pill primary grow" style="justify-content:center">10 reps</div>
      <div class="pill primary grow" style="justify-content:center;opacity:.55">7 / 10</div>
      <div class="pill soft grow" style="justify-content:center">—</div>
    </div>
  </div>

  <div class="card row g12" style="padding:12px 14px;opacity:.85">
    <div class="tile plain"><i class="ic">skip_next</i></div>
    <div class="grow"><div class="xs muted semi">UP NEXT</div><div class="h3">Shoulder Press</div></div>
    <div class="sm semi">3 × 12</div>
  </div>

  <div class="row g12 mt-auto" style="padding-bottom:40px">
    <div class="icon-btn" style="width:58px;height:58px;border-radius:20px"><i class="ic">skip_previous</i></div>
    <div class="btn grow round" style="height:58px"><i class="ic fill">pause</i>Pause</div>
    <div class="icon-btn" style="width:58px;height:58px;border-radius:20px"><i class="ic">skip_next</i></div>
  </div>
  <div class="home-ind"></div>
</div>

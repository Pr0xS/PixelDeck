<div class="screen" style="gap:14px;background:linear-gradient(180deg,#f8faff 0%,#e8ebff 100%)">
  <div class="topbar">
    <div class="icon-btn"><i class="ic s20">close</i></div>
    <div class="h3">Focus mode</div>
    <div class="icon-btn"><i class="ic s20">tune</i></div>
  </div>

  <div class="seg" style="margin-top:4px"><div class="on">Focus</div><div>Short break</div><div>Long break</div></div>

  <div style="display:flex;justify-content:center;margin-top:12px;position:relative">
    <div style="position:absolute;inset:-18px 40px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.22),transparent 68%)"></div>
    <div class="ring" style="--v:68;--size:272px;--thick:20px;--c:#6366f1;background:#fff;box-shadow:0 20px 50px rgba(79,70,229,.18)">
      <div class="kpi num" style="font-size:66px">16:42</div>
      <div class="sm muted semi" style="margin-top:6px">remaining</div>
    </div>
  </div>

  <div style="text-align:center;margin-top:6px">
    <div class="caps muted">Now focusing on</div>
    <div class="h2" style="margin-top:4px">Write sprint summary</div>
  </div>

  <div class="row center g16" style="margin-top:2px">
    <div class="icon-btn" style="width:54px;height:54px;border-radius:50%"><i class="ic">replay</i></div>
    <div style="width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b7cf8);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 30px rgba(99,102,241,.45)"><i class="ic fill" style="font-size:40px">pause</i></div>
    <div class="icon-btn" style="width:54px;height:54px;border-radius:50%"><i class="ic">skip_next</i></div>
  </div>

  <div class="row center g8" style="margin-top:4px">
    <i style="width:28px;height:8px;border-radius:4px;background:#6366f1"></i><i style="width:28px;height:8px;border-radius:4px;background:#6366f1"></i><i style="width:28px;height:8px;border-radius:4px;background:#6366f1"></i><i style="width:28px;height:8px;border-radius:4px;background:#c7cbf9"></i>
    <span class="xs muted semi" style="margin-left:6px">Session 3 of 4</span>
  </div>

  <div class="card row g12" style="padding:12px 14px">
    <div class="tile sm" style="background:#fef3c7;color:#f59e0b"><i class="ic s20 fill">notifications_off</i></div>
    <div class="grow"><div class="h3" style="font-size:14px">Do not disturb</div><div class="xs muted">Notifications paused until 3:30 PM</div></div>
    <div class="toggle on"></div>
  </div>

  <div class="tabbar">
    <div><i class="ic">task_alt</i>Today</div>
    <div><i class="ic">calendar_month</i>Calendar</div>
    <div class="on"><i class="ic fill">timer</i>Focus</div>
    <div><i class="ic">folder</i>Projects</div>
    <div><i class="ic">insights</i>Stats</div>
  </div>
  <div class="home-ind"></div>
</div>
